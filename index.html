<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحرر القانوني والإداري الصارم</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #f8fafc;
            --text: #0f172a;
            --border: #cbd5e1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-top: 5px solid var(--primary);
        }
        h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 5px; }
        p.subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            flex-grow: 1;
        }
        button:hover { background-color: #172554; }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }
        #result-container {
            background-color: var(--secondary);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 5px;
            min-height: 200px;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 1rem;
        }
        .loading { display: none; color: var(--primary); font-weight: bold; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>المحرر القانوني والإداري</h1>
        <p class="subtitle">أداة مخصصة للتحضير لمباراة عمداء الشرطة (محرك Gemini).</p>

        <textarea id="user-input" placeholder="أدخل الموضوع القانوني أو الإداري هنا (بالعربية أو الفرنسية)..."></textarea>
        
        <div class="controls">
            <button id="submit-btn" onclick="processRequest()">تحرير الموضوع</button>
        </div>

        <div id="loading" class="loading">جاري الصياغة الإدارية... يرجى الانتظار.</div>
        
        <div id="result-container">ستظهر الإجابة المهيكلة هنا...</div>
    </div>

    <script>
        // --- ضع المفتاح الخاص بك هنا ---
        const API_KEY = "حط_المفتاح_ديالك_هنا"; 
        // -------------------------------

        const SYSTEM_PROMPT = `أنت خبير في القانون العام والخاص المغربي وإطار إداري أمني عالي.
1. إذا كان السؤال بالعربية: أجب بلغة إدارية صارمة ومباشرة، بدون حشو. استخدم هيكلة قانونية واضحة (مقدمة، مباحث، مطالب). اعتمد المصطلحات القانونية المغربية حصراً.
2. Si la question est en français: Réponds avec une rigueur administrative et juridique absolue. Pas de phrases génériques. Structure obligatoirement en plan bipartite (I. A/B, II. A/B). Utilise un vocabulaire juridique marocain précis.
3. التزم بالحياد والموضوعية التامة.`;

        async function processRequest() {
            const inputField = document.getElementById('user-input');
            const submitBtn = document.getElementById('submit-btn');
            const resultContainer = document.getElementById('result-container');
            const loadingIndicator = document.getElementById('loading');
            const query = inputField.value.trim();

            if (!query) {
                alert("المرجاء إدخال موضوع أو سؤال قانوني أولاً.");
                return;
            }

            if (API_KEY === "حط_المفتاح_ديالك_هنا") {
                alert("نسيتي ما حطيتيش مفتاح API فالكود! سير جيبو من aistudio.google.com وحطو فسطر المتغير API_KEY.");
                return;
            }

            inputField.disabled = true;
            submitBtn.disabled = true;
            loadingIndicator.style.display = "block";
            resultContainer.innerText = "";

            const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
            
            const requestBody = {
                systemInstruction: {
                    parts: [{ text: SYSTEM_PROMPT }]
                },
                contents: [{ parts: [{ text: query }] }],
                generationConfig: {
                    temperature: 0.1, 
                    maxOutputTokens: 2048
                }
            };

            try {
                const response = await fetch(GEMINI_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error ? data.error.message : "خطأ في الشبكة.");
                }

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                    resultContainer.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    resultContainer.innerText = "لم يتم الحصول على إجابة واضحة.";
                }

            } catch (error) {
                console.error("Erreur:", error);
                resultContainer.innerText = `حدث خطأ: ${error.message}`;
            } finally {
                inputField.disabled = false;
                submitBtn.disabled = false;
                loadingIndicator.style.display = "none";
            }
        }
    </script>
</body>
</html>
