<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مولّد مواضيع الامتحان المهني</title>
<style>
:root{--bg:#eef2f4;--panel:#fff;--ink:#16252e;--muted:#5b6b75;--line:#cfd9de;--accent:#0e5a6e;--accent-ink:#fff;--stamp:#b3261e;--soft:#e3eef1}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a20;--panel:#16252e;--ink:#e8eef1;--muted:#93a4ad;--line:#2b3e49;--accent:#5fb7cc;--accent-ink:#06222b;--stamp:#ff8a80;--soft:#1c3340}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:820px;padding:16px;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.7}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 14px}
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card{border-inline-start:5px solid var(--stamp)}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:.9rem}
textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:100px;resize:vertical}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--accent);padding:8px 14px;background:transparent;color:var(--accent);font-weight:600}
button.main{background:var(--accent);color:var(--accent-ink);width:100%;margin-top:14px;padding:12px;font-size:1.05rem}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fr{direction:ltr;text-align:left;font-family:Georgia,"Times New Roman",serif;font-size:1.08rem;line-height:1.65}
.fr h3{margin:0 0 8px;font-size:1.25rem}
.ar{color:var(--muted);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.extra{margin-top:12px;background:var(--soft);border-radius:8px;padding:12px}
.extra ul{margin:6px 0 0;padding-inline-start:20px}
.corr{white-space:pre-wrap}
.err{color:var(--stamp);font-weight:600}
</style>
